<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halftone Aurora — Drift</title>
<link rel="stylesheet" href="_kit-skin.css" />
<link rel="stylesheet" href="_halftone.css" />
</head>
<body>
<canvas id="cv" class="field" aria-label="Ambient halftone stipple. Dragging shifts the color field beneath the dots."></canvas>
<div class="bar"><span class="name">Drift</span><a class="back" href="index.html">← mockups</a></div>
<div class="caption" id="cap"></div>
<footer class="hf"><span class="status proposal">proposal</span><span id="fileName"></span></footer>
<script src="_halftone.js"></script>
<script>
"use strict";
const cv = document.getElementById("cv");
const r = HA.make2D(cv);
const shift = { x: 0, y: 0, vx: 0, vy: 0 };
HA.chrome({
  name: "Drift",
  body: "Canvas 2D · quiet stipple in indigo/magenta. The dot matrix stays fixed; dragging shifts the color foci beneath it, like a force field under the dots.",
  hint: "drag — foci glide away and drift home",
  file: "halftone-drift.html",
});
HA.trackPointer(cv, (x, y, vx, vy, kind) => {
  if (kind === "drag") {
    shift.vx += (vx / HA.dims.H) * 0.055;
    shift.vy += (-vy / HA.dims.H) * 0.055;
  }
});
const draw = (t, dt) => {
  if (!HA.motionOff()) {
    shift.vx += (-60 * shift.x - 11 * shift.vx) * dt;
    shift.vy += (-60 * shift.y - 11 * shift.vy) * dt;
    shift.x = HA.clamp(shift.x + shift.vx * dt, -0.3, 0.3);
    shift.y = HA.clamp(shift.y + shift.vy * dt, -0.2, 0.2);
  }
  r.render(t, dt, { spacing: 15, rMax: 4.2, set: HA.FOCI_DRIFT, warp: false, glow: true, shift: () => shift, freeze: HA.motionOff(), under: 0.30 });
};
HA.fit([cv]);
addEventListener("resize", () => { HA.fit([cv]); r.render.rebuild(); if (HA.motionOff()) draw(4.2, 0.016); });
HA.start(draw);
</script>
</body>
</html>
