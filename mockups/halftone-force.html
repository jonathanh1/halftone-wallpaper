<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halftone Aurora — Force</title>
<link rel="stylesheet" href="_kit-skin.css" />
<link rel="stylesheet" href="_halftone.css" />
</head>
<body>
<canvas id="cv" class="field" aria-label="Interactive WebGL halftone aurora field. Drag to displace and illuminate dots."></canvas>
<div class="bar"><span class="name">Force</span><a class="back" href="index.html">← mockups</a></div>
<div class="caption" id="cap"></div>
<div class="gl-fail" id="glFail">WebGL unavailable on this device</div>
<footer class="hf"><span class="status proposal">proposal</span><span id="fileName"></span></footer>
<script src="_halftone.js"></script>
<script>
"use strict";
const cv = document.getElementById("cv");
const glr = HA.makeGL(cv);
HA.chrome({
  name: "Force",
  body: "WebGL fragment shader · the aurora masked through a fine circular halftone. Drag displaces the cell field and lights the wake; release springs it back.",
  hint: "press and drag — displaced dots re-seat with damped overshoot",
  file: "halftone-force.html",
});
if (!glr) {
  document.getElementById("glFail").classList.add("show");
} else {
  HA.trackPointer(cv, (x, y, vx, vy, kind) => glr.onPointer(x, y, vx, vy, kind));
  HA.fit([cv]);
  addEventListener("resize", () => { HA.fit([cv]); if (HA.motionOff()) glr.render(4.2, 0.016); });
  HA.start((t, dt) => glr.render(t, dt));
}
</script>
</body>
</html>
